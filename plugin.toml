schema = 1
id = "tern-kube"
name = "Tern Kube"
version = "1.0.0"
description = "Native views for kubectl output, with an explicit Explore block and an opt-in mutation guard."
icon = "box"
host = "plugin/host.luau"
window = "plugin/window.luau"
styles = ["plugin/tern-kube.css", "plugin/explore.css", "plugin/mutate.css", "plugin/settings.css", "plugin/logs.css"]

# Globs over-claim (`kubectl -* get *` also matches `kubectl -n x logs pod get`);
# the lens re-derives the verb from argv (logs, events or the table/describe/
# mutation pipeline) and returns raw for anything it cannot show.
[[lenses]]
id = "kubectl"
match = [
	"kubectl get",
	"kubectl get *",
	"kubectl describe *",
	"kubectl top *",
	"kubectl apply *",
	"kubectl delete *",
	"kubectl rollout restart *",
	"kubectl scale *",
	"kubectl label *",
	"kubectl annotate *",
	"kubectl patch *",
	"kubectl cordon *",
	"kubectl uncordon *",
	"kubectl rollout undo *",
	"kubectl rollout pause *",
	"kubectl rollout resume *",
	"kubectl logs *",
	"kubectl events",
	"kubectl events *",
	"kubectl -* get",
	"kubectl -* get *",
	"kubectl -* describe *",
	"kubectl -* top *",
	"kubectl -* apply *",
	"kubectl -* delete *",
	"kubectl -* rollout restart *",
	"kubectl -* scale *",
	"kubectl -* label *",
	"kubectl -* annotate *",
	"kubectl -* patch *",
	"kubectl -* cordon *",
	"kubectl -* uncordon *",
	"kubectl -* rollout undo *",
	"kubectl -* rollout pause *",
	"kubectl -* rollout resume *",
	"kubectl -* logs *",
	"kubectl -* events",
	"kubectl -* events *",
	"kubecolor get",
	"kubecolor get *",
	"kubecolor describe *",
	"kubecolor top *",
	"kubecolor apply *",
	"kubecolor delete *",
	"kubecolor rollout restart *",
	"kubecolor scale *",
	"kubecolor label *",
	"kubecolor annotate *",
	"kubecolor patch *",
	"kubecolor cordon *",
	"kubecolor uncordon *",
	"kubecolor rollout undo *",
	"kubecolor rollout pause *",
	"kubecolor rollout resume *",
	"kubecolor logs *",
	"kubecolor events",
	"kubecolor events *",
	"kubecolor -* get",
	"kubecolor -* get *",
	"kubecolor -* describe *",
	"kubecolor -* top *",
	"kubecolor -* apply *",
	"kubecolor -* delete *",
	"kubecolor -* rollout restart *",
	"kubecolor -* scale *",
	"kubecolor -* label *",
	"kubecolor -* annotate *",
	"kubecolor -* patch *",
	"kubecolor -* cordon *",
	"kubecolor -* uncordon *",
	"kubecolor -* rollout undo *",
	"kubecolor -* rollout pause *",
	"kubecolor -* rollout resume *",
	"kubecolor -* logs *",
	"kubecolor -* events",
	"kubecolor -* events *",
	# BEGIN tern-kube aliases
	# END tern-kube aliases
]

