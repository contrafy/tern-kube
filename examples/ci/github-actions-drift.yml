# Cluster drift report for GitHub Actions, using kube-lens-drift
# (github.com/contrafy/tern-kube-lens, bin/kube-lens-drift).
#
# Setup (details: docs/gitops.md, "CI"):
#   1. Copy bin/kube-lens-drift to .github/kube-lens-drift in your repository.
#   2. Apply examples/ci/rbac-drift-readonly.yaml (adjusted) to the cluster and
#      store a kubeconfig for its ServiceAccount in the repository (or
#      environment) secret KUBE_LENS_DRIFT_KUBECONFIG.
#   3. Copy this file to .github/workflows/kube-lens-drift.yml and set
#      DRIFT_SOURCES below.
#
# Pull requests get one sticky comment (updated on every push); every run
# writes the report to the job summary. Scheduled and manual runs fail when
# the cluster has drifted; pull request runs fail only on errors.
# The kubeconfig is written to a 0600 file under $RUNNER_TEMP and never
# printed. Fork pull requests get no secrets and skip the check.
name: kube-lens drift

on:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "23 6 * * 1-5"

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: kube-lens-drift-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  # One kube-lens-drift source per line (-f PATH [-R] | -k DIR |
  # --helm CHART --release R [-f VALUES]...), plus optional -n NS.
  # Words are split on spaces: no quoting, no spaces in paths.
  DRIFT_SOURCES: |
    -k deploy/overlays/production
  # Context inside the kubeconfig; empty = its current-context.
  DRIFT_CONTEXT: ""
  MAX_DIFF_LINES: "200"
  # GitHub rejects comments over 65536 characters.
  MAX_COMMENT_BYTES: "60000"
  KUBE_LENS_DRIFT: .github/kube-lens-drift
  KUBECTL_VERSION: v1.34.1
  KUBECTL_SHA256: 7721f265e18709862655affba5343e85e1980639395d5754473dafaadcaa69e3

jobs:
  drift:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install kubectl
        run: |
          set -eu
          mkdir -p "$RUNNER_TEMP/bin"
          curl -fsSLo "$RUNNER_TEMP/bin/kubectl" "https://dl.k8s.io/release/$KUBECTL_VERSION/bin/linux/amd64/kubectl"
          echo "$KUBECTL_SHA256  $RUNNER_TEMP/bin/kubectl" | sha256sum -c -
          chmod 755 "$RUNNER_TEMP/bin/kubectl"
          echo "$RUNNER_TEMP/bin" >>"$GITHUB_PATH"

      - name: Write kubeconfig
        id: kubeconfig
        env:
          KUBECONFIG_DATA: ${{ secrets.KUBE_LENS_DRIFT_KUBECONFIG }}
        run: |
          set -eu
          if [ -z "$KUBECONFIG_DATA" ]; then
            echo "::notice::KUBE_LENS_DRIFT_KUBECONFIG is not available (fork pull request or unset secret); skipping drift check"
            echo "available=false" >>"$GITHUB_OUTPUT"
            exit 0
          fi
          umask 077
          printf '%s\n' "$KUBECONFIG_DATA" >"$RUNNER_TEMP/kubeconfig"
          echo "available=true" >>"$GITHUB_OUTPUT"

      - name: Report drift
        id: drift
        if: steps.kubeconfig.outputs.available == 'true'
        env:
          KUBECONFIG: ${{ runner.temp }}/kubeconfig
        run: |
          set +e -u
          report=$RUNNER_TEMP/drift.md
          count=$(printf '%s\n' "$DRIFT_SOURCES" | grep -c '[^[:space:]]')
          budget=$(( (MAX_COMMENT_BYTES - 200) / (count > 0 ? count : 1) ))
          printf '<!-- kube-lens-drift -->\n## Cluster drift\n\n' >"$report"
          worst=0
          while IFS= read -r line; do
            case $line in *[![:space:]]*) ;; *) continue ;; esac
            set -f
            set -- $line
            set +f
            sh "$KUBE_LENS_DRIFT" "$@" ${DRIFT_CONTEXT:+--context "$DRIFT_CONTEXT"} --kubeconfig "$KUBECONFIG" \
              --format markdown --max-diff-lines "$MAX_DIFF_LINES" --max-bytes "$budget" >"$RUNNER_TEMP/one.md"
            rc=$?
            if [ "$rc" -gt 1 ]; then
              echo "::error::kube-lens-drift failed for: $line"
              printf '### Drift: %s\n\nkube-lens-drift failed (exit %s); see the workflow log.\n' "$line" "$rc" >"$RUNNER_TEMP/one.md"
            fi
            cat "$RUNNER_TEMP/one.md" >>"$report"
            printf '\n' >>"$report"
            [ "$rc" -le "$worst" ] || worst=$rc
          done <<EOF
          $DRIFT_SOURCES
          EOF
          printf '\n<sub>%s run %s for %s</sub>\n' "$GITHUB_WORKFLOW" "$GITHUB_RUN_ID" "${GITHUB_SHA:0:12}" >>"$report"
          cat "$report" >>"$GITHUB_STEP_SUMMARY"
          echo "exit=$worst" >>"$GITHUB_OUTPUT"

      - name: Update sticky PR comment
        if: github.event_name == 'pull_request' && steps.drift.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          set -eu
          id=$(gh api --paginate "repos/$GITHUB_REPOSITORY/issues/$PR/comments" \
            --jq '.[] | select(.user.login == "github-actions[bot]" and (.body | startswith("<!-- kube-lens-drift -->"))) | .id' | tail -n 1)
          if [ -n "$id" ]; then
            gh api -X PATCH "repos/$GITHUB_REPOSITORY/issues/comments/$id" -F "body=@$RUNNER_TEMP/drift.md" >/dev/null
          else
            gh pr comment "$PR" --repo "$GITHUB_REPOSITORY" --body-file "$RUNNER_TEMP/drift.md" >/dev/null
          fi

      - name: Result
        if: steps.drift.outcome == 'success'
        env:
          DRIFT_EXIT: ${{ steps.drift.outputs.exit }}
          EVENT: ${{ github.event_name }}
        run: |
          case $DRIFT_EXIT in
          0) echo "No drift." ;;
          1)
            echo "Drift detected; see the job summary."
            if [ "$EVENT" != pull_request ]; then exit 1; fi
            ;;
          *) echo "kube-lens-drift failed; see the Report drift step."; exit 1 ;;
          esac

      - name: Remove kubeconfig
        if: always()
        run: rm -f "$RUNNER_TEMP/kubeconfig"
