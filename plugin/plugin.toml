schema = 1
id = "tern-kube"
name = "Tern Kube"
version = "0.0.1"
description = "Native views for kubectl output, with an explicit Explore block and an opt-in mutation guard."
icon = "box"
host = "host.luau"
window = "window.luau"
styles = ["tern-kube.css", "explore.css", "mutate.css", "settings.css"]

# Globs over-claim (`kubectl -* get *` also matches `kubectl -n x logs pod get`);
# the lens re-derives the verb from argv and returns raw for anything else.
[[lenses]]
id = "kubectl"
match = [
	"kubectl get",
	"kubectl get *",
	"kubectl describe *",
	"kubectl top *",
	"kubectl apply *",
	"kubectl delete *",
	"kubectl rollout restart *",
	"kubectl scale *",
	"kubectl -* get",
	"kubectl -* get *",
	"kubectl -* describe *",
	"kubectl -* top *",
	"kubectl -* apply *",
	"kubectl -* delete *",
	"kubectl -* rollout restart *",
	"kubectl -* scale *",
	"kubecolor get",
	"kubecolor get *",
	"kubecolor describe *",
	"kubecolor top *",
	"kubecolor apply *",
	"kubecolor delete *",
	"kubecolor rollout restart *",
	"kubecolor scale *",
	"kubecolor -* get",
	"kubecolor -* get *",
	"kubecolor -* describe *",
	"kubecolor -* top *",
	"kubecolor -* apply *",
	"kubecolor -* delete *",
	"kubecolor -* rollout restart *",
	"kubecolor -* scale *",
	# BEGIN tern-kube aliases
	# END tern-kube aliases
]

[[blocks]]
id = "explore"
title = "Tern Kube Explore"
icon = "box"

[[blocks]]
id = "approve"
title = "Tern Kube Approve"
icon = "shield"
palette = false

[[blocks]]
id = "settings"
title = "Tern Kube Settings"
icon = "sliders"
