apiVersion: v1
kind: ConfigMap
metadata:
  name: web-config
  namespace: tern-test-gitops-ui
data:
  greeting: hello
  mode: production
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  namespace: tern-test-gitops-ui
  labels:
    app: web
spec:
  replicas: 1
  selector:
    matchLabels:
      app: web
  template:
    metadata:
      labels:
        app: web
    spec:
      terminationGracePeriodSeconds: 1
      containers:
        - name: web
          image: registry.k8s.io/pause:3.10
          imagePullPolicy: IfNotPresent
          resources:
            limits:
              cpu: 50m
              memory: 32Mi
