# Objects carrying the tracking metadata Argo CD and Flux stamp on what they
# apply; owner() attributes each one (or none) to a controller object.
apiVersion: v1
kind: ConfigMap
metadata:
  name: argo-label
  namespace: tern-test-gitops
  labels:
    app.kubernetes.io/instance: guestbook
data:
  tracked-by: label
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: argo-annotated
  namespace: tern-test-gitops
  annotations:
    argocd.argoproj.io/tracking-id: guestbook-drifted:/ConfigMap:tern-test-gitops/argo-annotated
data:
  tracked-by: annotation
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: argo-copied
  namespace: tern-test-gitops
  annotations:
    argocd.argoproj.io/tracking-id: guestbook:/ConfigMap:tern-test-gitops/argo-label
data:
  tracked-by: copied annotation of another object
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: flux-kustomized
  namespace: tern-test-gitops
  labels:
    kustomize.toolkit.fluxcd.io/name: apps
    kustomize.toolkit.fluxcd.io/namespace: tern-test-gitops
data:
  tracked-by: flux kustomization
---
apiVersion: v1
kind: Service
metadata:
  name: podinfo
  namespace: tern-test-gitops
  labels:
    app.kubernetes.io/instance: podinfo
    helm.toolkit.fluxcd.io/name: podinfo
    helm.toolkit.fluxcd.io/namespace: tern-test-gitops
spec:
  selector:
    app: podinfo
  ports:
    - name: http
      port: 9898
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: helm-only
  namespace: tern-test-gitops
  labels:
    app.kubernetes.io/instance: some-release
    app.kubernetes.io/managed-by: Helm
data:
  tracked-by: plain helm (no controller object)
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: untracked
  namespace: tern-test-gitops
data:
  tracked-by: nothing
