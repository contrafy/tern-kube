apiVersion: v1
kind: ConfigMap
metadata:
  name: api-config
  namespace: tern-test-mutate
data:
  LOG_LEVEL: debug
  CACHE_TTL: 30s
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: tern-test-mutate
  labels:
    app: api
    release: v2
spec:
  replicas: 2
  selector:
    matchLabels:
      app: api
  template:
    metadata:
      labels:
        app: api
    spec:
      terminationGracePeriodSeconds: 1
      containers:
        - name: api
          image: registry.k8s.io/pause:3.10
          imagePullPolicy: IfNotPresent
---
apiVersion: v1
kind: Service
metadata:
  name: api
  namespace: tern-test-mutate
  labels:
    app: api
spec:
  selector:
    app: api
  ports:
    - name: http
      port: 80
      targetPort: 8080
