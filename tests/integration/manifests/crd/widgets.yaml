apiVersion: lens.example.com/v1alpha1
kind: Widget
metadata:
  name: gizmo
  namespace: tern-test-crd
  labels:
    app: widgets
spec:
  color: blue
  size: 3
  description: A small blue gizmo
  owner: team-platform
  enabled: true
---
apiVersion: lens.example.com/v1alpha1
kind: Widget
metadata:
  name: sprocket
  namespace: tern-test-crd
  labels:
    app: widgets
spec:
  color: green
  size: 120
  owner: team-data
  enabled: false
---
apiVersion: lens.example.com/v1alpha1
kind: Widget
metadata:
  name: long-description
  namespace: tern-test-crd
  labels:
    app: widgets
spec:
  color: red
  size: 7
  description: This widget has a deliberately long description so that the printer column grows far wider than the terminal and the lens must truncate or wrap it without losing the remaining columns
  owner: team-ux
  enabled: true
