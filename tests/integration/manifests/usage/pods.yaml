# Usage views fixture world (tests/integration/usage/check.sh, e2e 91-94).
# Each pod pins one request/limit shape the usage formulas must get right.
---
# Effective request comes from the first init (500m/256Mi > app + sidecar);
# the app busy-loops against its 20m limit.
apiVersion: v1
kind: Pod
metadata:
  name: sidecar-init
  namespace: tern-test-usage
  labels:
    app.kubernetes.io/name: sidecar-init
spec:
  terminationGracePeriodSeconds: 0
  initContainers:
    - name: setup
      image: busybox:1.37
      command: ["sh", "-c", "true"]
      resources:
        requests: {cpu: 500m, memory: 256Mi}
    - name: proxy
      image: busybox:1.37
      restartPolicy: Always
      command: ["sh", "-c", "sleep 100000"]
      resources:
        requests: {cpu: 20m, memory: 16Mi}
        limits: {cpu: 50m, memory: 32Mi}
  containers:
    - name: app
      image: busybox:1.37
      command: ["sh", "-c", "while true; do :; done"]
      resources:
        requests: {cpu: 10m, memory: 8Mi}
        limits: {cpu: 20m, memory: 64Mi}
---
apiVersion: v1
kind: Pod
metadata:
  name: limits-only
  namespace: tern-test-usage
  labels:
    app.kubernetes.io/name: limits-only
spec:
  terminationGracePeriodSeconds: 0
  containers:
    - name: app
      image: busybox:1.37
      command: ["sh", "-c", "sleep 100000"]
      resources:
        limits: {cpu: 100m, memory: 32Mi}
---
# Pod-level resources: `kubectl describe node` leaves these out of its
# Allocated resources; the scheduler (and the usage views) count them.
apiVersion: v1
kind: Pod
metadata:
  name: pod-level
  namespace: tern-test-usage
  labels:
    app.kubernetes.io/name: pod-level
spec:
  terminationGracePeriodSeconds: 0
  resources:
    requests: {cpu: 200m, memory: 64Mi}
    limits: {cpu: 400m, memory: 128Mi}
  containers:
    - name: a
      image: busybox:1.37
      command: ["sh", "-c", "sleep 100000"]
    - name: b
      image: busybox:1.37
      command: ["sh", "-c", "sleep 100000"]
---
apiVersion: v1
kind: Pod
metadata:
  name: cpu-burner
  namespace: tern-test-usage
  labels:
    app.kubernetes.io/name: cpu-burner
spec:
  terminationGracePeriodSeconds: 0
  containers:
    - name: burn
      image: busybox:1.37
      command: ["sh", "-c", "while true; do :; done"]
      resources:
        requests: {cpu: 10m, memory: 8Mi}
        limits: {cpu: 20m, memory: 32Mi}
