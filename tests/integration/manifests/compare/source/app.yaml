# GitOps source for the compare matrix: tkm-web, tkm-api, Service tkm-web and
# tkm-config as in cluster A, plus tkm-flags (present in A, missing in B).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: tkm-web
  namespace: tern-test-mc
  labels:
    app: tkm-web
    tier: frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: tkm-web
  template:
    metadata:
      labels:
        app: tkm-web
    spec:
      containers:
      - name: web
        image: nginx:1.27-alpine
        ports:
        - containerPort: 80
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: tkm-api
  namespace: tern-test-mc
  labels:
    app: tkm-api
spec:
  replicas: 1
  selector:
    matchLabels:
      app: tkm-api
  template:
    metadata:
      labels:
        app: tkm-api
    spec:
      containers:
      - name: web
        image: nginx:1.27-alpine
        ports:
        - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: tkm-web
  namespace: tern-test-mc
spec:
  selector:
    app: tkm-web
  ports:
  - port: 80
    targetPort: 80
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: tkm-config
  namespace: tern-test-mc
data:
  LOG_LEVEL: info
  FEATURE_X: "on"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: tkm-flags
  namespace: tern-test-mc
data:
  ROLLOUT: canary
