# Cluster B (kind-tern-kube-dev2) of the multi-cluster compare world; see a.yaml.
apiVersion: v1
kind: Namespace
metadata:
  name: tern-test-mc
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: tkm-web
  namespace: tern-test-mc
  labels:
    app: tkm-web
spec:
  replicas: 3
  selector:
    matchLabels:
      app: tkm-web
  template:
    metadata:
      labels:
        app: tkm-web
    spec:
      containers:
      - name: web
        image: nginx:1.28-alpine
        ports:
        - containerPort: 80
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: tkm-api
  namespace: tern-test-mc
  labels:
    app: tkm-api
spec:
  replicas: 1
  selector:
    matchLabels:
      app: tkm-api
  template:
    metadata:
      labels:
        app: tkm-api
    spec:
      containers:
      - name: web
        image: nginx:1.27-alpine
        ports:
        - containerPort: 80
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: tkm-only-b
  namespace: tern-test-mc
  labels:
    app: tkm-only-b
spec:
  replicas: 1
  selector:
    matchLabels:
      app: tkm-only-b
  template:
    metadata:
      labels:
        app: tkm-only-b
    spec:
      containers:
      - name: web
        image: nginx:1.27-alpine
        ports:
        - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: tkm-web
  namespace: tern-test-mc
spec:
  selector:
    app: tkm-web
  ports:
  - port: 80
    targetPort: 80
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: tkm-config
  namespace: tern-test-mc
data:
  LOG_LEVEL: debug
  FEATURE_X: "on"
---
apiVersion: v1
kind: Secret
metadata:
  name: tkm-secret
  namespace: tern-test-mc
type: Opaque
stringData:
  username: admin
  password: s3cret-B
