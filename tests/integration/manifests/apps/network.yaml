apiVersion: v1
kind: Service
metadata:
  name: web
  namespace: tern-test-apps
  labels:
    app: web
spec:
  type: ClusterIP
  selector:
    app: web
  ports:
    - name: http
      port: 80
      targetPort: http
---
apiVersion: v1
kind: Service
metadata:
  name: web-nodeport
  namespace: tern-test-apps
  labels:
    app: web
spec:
  type: NodePort
  selector:
    app: web
  ports:
    - name: http
      port: 80
      targetPort: http
      nodePort: 30080
---
apiVersion: v1
kind: Service
metadata:
  name: db-headless
  namespace: tern-test-apps
  labels:
    app: db
spec:
  clusterIP: None
  selector:
    app: db
  ports:
    - name: postgres
      port: 5432
---
apiVersion: v1
kind: Service
metadata:
  name: web-lb
  namespace: tern-test-apps
  labels:
    app: web
spec:
  type: LoadBalancer
  selector:
    app: web
  ports:
    - name: http
      port: 80
      targetPort: http
      nodePort: 30081
    - name: https
      port: 443
      targetPort: http
      nodePort: 30443
---
apiVersion: v1
kind: Service
metadata:
  name: external-docs
  namespace: tern-test-apps
spec:
  type: ExternalName
  externalName: docs.example.com
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: web
  namespace: tern-test-apps
  labels:
    app: web
spec:
  tls:
    - hosts:
        - app.example.com
        - api.example.com
      secretName: web-tls
  rules:
    - host: app.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: web
                port:
                  name: http
    - host: api.example.com
      http:
        paths:
          - path: /v1
            pathType: Prefix
            backend:
              service:
                name: web
                port:
                  number: 80
