apiVersion: apps/v1
kind: Deployment
metadata:
  name: tkm-g12-imm
  namespace: tern-test-mutate
  labels:
    app.kubernetes.io/part-of: tern-kube-mutate-it
spec:
  replicas: 1
  selector:
    matchLabels:
      app: tkm-g12-imm
  template:
    metadata:
      labels:
        app: tkm-g12-imm
    spec:
      terminationGracePeriodSeconds: 1
      containers:
        - name: main
          image: registry.k8s.io/pause:3.10
          resources:
            limits:
              cpu: 100m
              memory: 64Mi
