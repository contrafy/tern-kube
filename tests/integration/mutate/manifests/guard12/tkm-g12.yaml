apiVersion: apps/v1
kind: Deployment
metadata:
  name: tkm-g12
  namespace: tern-test-mutate
  labels:
    app.kubernetes.io/part-of: tern-kube-mutate-it
    tkm-g12: "yes"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: tkm-g12
  template:
    metadata:
      labels:
        app: tkm-g12
    spec:
      terminationGracePeriodSeconds: 1
      containers:
        - name: main
          image: registry.k8s.io/pause:3.10
          resources:
            limits:
              cpu: 100m
              memory: 64Mi
