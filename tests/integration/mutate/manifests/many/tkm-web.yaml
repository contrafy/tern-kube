apiVersion: apps/v1
kind: Deployment
metadata:
  name: tkm-web
  namespace: tern-test-mutate
  labels:
    app: tkm-web
    app.kubernetes.io/part-of: tern-kube-mutate-it
spec:
  replicas: 1
  selector:
    matchLabels:
      app: tkm-web
  template:
    metadata:
      labels:
        app: tkm-web
    spec:
      terminationGracePeriodSeconds: 1
      containers:
        - name: web
          image: registry.k8s.io/pause:3.10
          imagePullPolicy: IfNotPresent
          resources:
            requests:
              cpu: 5m
              memory: 8Mi
            limits:
              cpu: 50m
              memory: 32Mi
---
apiVersion: v1
kind: Service
metadata:
  name: tkm-web
  namespace: tern-test-mutate
  labels:
    app.kubernetes.io/part-of: tern-kube-mutate-it
spec:
  selector:
    app: tkm-web
  ports:
    - name: http
      port: 80
      targetPort: 8080
