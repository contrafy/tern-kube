apiVersion: v1
kind: Pod
metadata:
  name: tkm-drain-bare
  namespace: tern-test-mutate
  labels:
    app.kubernetes.io/part-of: tern-kube-mutate-it
    app: tkm-drain-pre
spec:
  terminationGracePeriodSeconds: 5
  containers:
    - name: main
      image: registry.k8s.io/pause:3.10
      volumeMounts:
        - name: scratch
          mountPath: /scratch
  volumes:
    - name: scratch
      emptyDir: {}
