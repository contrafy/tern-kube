apiVersion: apps/v1
kind: Deployment
metadata:
  name: tkm-drain
  namespace: tern-test-mutate
  labels:
    app.kubernetes.io/part-of: tern-kube-mutate-it
spec:
  replicas: 1
  selector:
    matchLabels:
      app: tkm-drain
  template:
    metadata:
      labels:
        app: tkm-drain
    spec:
      terminationGracePeriodSeconds: 5
      containers:
        - name: main
          image: registry.k8s.io/pause:3.10
