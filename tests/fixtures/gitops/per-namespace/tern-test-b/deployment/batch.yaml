apiVersion: apps/v1
kind: Deployment
metadata:
  name: batch
  namespace: tern-test-b
  labels:
    app: batch
spec:
  replicas: 1
  selector:
    matchLabels:
      app: batch
  template:
    metadata:
      labels:
        app: batch
    spec:
      containers:
        - name: batch
          image: nginx:1.27-alpine
          ports:
            - containerPort: 80
