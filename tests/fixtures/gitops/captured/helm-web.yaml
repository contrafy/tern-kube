---
# Source: shop/templates/configmap.yaml
apiVersion: v1
kind: ConfigMap
metadata:
  name: web-shop-config
  namespace: tern-test-helm
data:
  mode: "staging"
---
# Source: shop/templates/service.yaml
apiVersion: v1
kind: Service
metadata:
  name: web-shop
  labels:
    app.kubernetes.io/name: shop
    app.kubernetes.io/instance: web
spec:
  selector:
    app.kubernetes.io/name: shop
    app.kubernetes.io/instance: web
  ports:
    - port: 80
      targetPort: 80
---
# Source: shop/templates/deployment.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web-shop
  labels:
    app.kubernetes.io/name: shop
    app.kubernetes.io/instance: web
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: shop
      app.kubernetes.io/instance: web
  template:
    metadata:
      labels:
        app.kubernetes.io/name: shop
        app.kubernetes.io/instance: web
    spec:
      containers:
        - name: shop
          image: "nginx:1.27-alpine"
          ports:
            - containerPort: 80
