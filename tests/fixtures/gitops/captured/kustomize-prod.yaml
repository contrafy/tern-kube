apiVersion: v1
kind: Service
metadata:
  labels:
    app.kubernetes.io/part-of: shop
  name: prod-shop
  namespace: tern-test-prod
spec:
  ports:
  - port: 80
    targetPort: 80
  selector:
    app: shop
---
apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: shop
    app.kubernetes.io/part-of: shop
  name: prod-shop
  namespace: tern-test-prod
spec:
  replicas: 1
  selector:
    matchLabels:
      app: shop
  template:
    metadata:
      labels:
        app: shop
    spec:
      containers:
      - image: nginx:1.27-alpine
        name: shop
        ports:
        - containerPort: 80
