apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker
  namespace: tern-test-mixed
  labels:
    app: worker
spec:
  replicas: 1
  selector:
    matchLabels:
      app: worker
  template:
    metadata:
      labels:
        app: worker
    spec:
      containers:
        - name: worker
          image: nginx:1.27-alpine
          ports:
            - containerPort: 80
