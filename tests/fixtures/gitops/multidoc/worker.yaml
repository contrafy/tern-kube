apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker
  namespace: tern-test-multi
  labels:
    app: worker
spec:
  replicas: 1
  selector:
    matchLabels:
      app: worker
  template:
    metadata:
      labels:
        app: worker
    spec:
      containers:
        - name: worker
          image: busybox:1.36
          ports:
            - containerPort: 80
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: worker
  namespace: tern-test-multi
