---
# Source: shop/templates/configmap.yaml
apiVersion: v1
kind: ConfigMap
metadata:
  name: stuck-d-shop-config
  namespace: tern-test-helm
data:
  mode: "default"
---
# Source: shop/templates/service.yaml
apiVersion: v1
kind: Service
metadata:
  name: stuck-d-shop
  labels:
    app.kubernetes.io/name: shop
    app.kubernetes.io/instance: stuck-d
spec:
  selector:
    app.kubernetes.io/name: shop
    app.kubernetes.io/instance: stuck-d
  ports:
    - port: 80
      targetPort: 80
---
# Source: shop/templates/deployment.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: stuck-d-shop
  labels:
    app.kubernetes.io/name: shop
    app.kubernetes.io/instance: stuck-d
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: shop
      app.kubernetes.io/instance: stuck-d
  template:
    metadata:
      labels:
        app.kubernetes.io/name: shop
        app.kubernetes.io/instance: stuck-d
    spec:
      containers:
        - name: shop
          image: "nginx:1.27-alpine"
          ports:
            - containerPort: 80

