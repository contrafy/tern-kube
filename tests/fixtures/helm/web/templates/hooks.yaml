apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "shop.fullname" . }}-pre-upgrade
  annotations:
    "helm.sh/hook": pre-upgrade,pre-rollback
    "helm.sh/hook-weight": "-5"
    "helm.sh/hook-delete-policy": before-hook-creation
data:
  revision: {{ .Release.Revision | quote }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "shop.fullname" . }}-post-install
  annotations:
    "helm.sh/hook": post-install
data:
  installed: "true"
