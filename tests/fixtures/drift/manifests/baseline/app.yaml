apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  namespace: tern-test-drift
  labels:
    app: web
spec:
  replicas: 1
  selector:
    matchLabels:
      app: web
  template:
    metadata:
      labels:
        app: web
    spec:
      serviceAccountName: web
      containers:
        - name: web
          image: registry.k8s.io/pause:3.10
          resources:
            requests:
              cpu: 5m
              memory: 8Mi
            limits:
              memory: 16Mi
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: app-config
  namespace: tern-test-drift
data:
  LOG_LEVEL: info
  CACHE_TTL: 60s
